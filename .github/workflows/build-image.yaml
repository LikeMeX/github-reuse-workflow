name: Build image

on:
  workflow_call:
    secrets:
      GH_PAT:
        # Read access to private GitHub repos installed as git dependencies (e.g. LikeMeX/fs-contracts).
        # Forwarded to BuildKit as the `gh_token` secret; Dockerfiles that don't mount it are unaffected.
        required: false
    inputs:
      environment:
        required: true
        type: string
      docker-registry:
        default: asia.gcr.io
        type: string
      docker-image: 
        required: true
        type: string
      docker-tag: 
        required: true
        type: string
      env-suffix:
        # Append "-<environment>" to the image tag (skipped for production and when the tag already ends with it).
        # dev/staging/enterprise-v2 push to one registry with the commit SHA as tag; without the suffix, two envs building
        # the same commit overwrite each other's image, and NEXT_PUBLIC_* baked at build time point at the wrong env.
        # Set false when docker-tag names an image built elsewhere or consumed outside this workflow.
        type: boolean
        default: true
      setup-platforms:
        default: amd64
        type: string
      build-platforms: 
        type: string
        default: linux/amd64
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string
      project_id:
        type: string

jobs:
  build-image:
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write'

    runs-on: ubuntu-latest
    # outputs:
    #   tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve image tag
        id: tag
        env:
          TAG: ${{ inputs.docker-tag }}
          ENV_NAME: ${{ inputs.environment }}
          SUFFIX: ${{ inputs.env-suffix }}
        run: |
          if [ "$SUFFIX" = true ] && [ "$ENV_NAME" != production ] && [ "${TAG%-$ENV_NAME}" = "$TAG" ]; then
            TAG="$TAG-$ENV_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Auth GCP 
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: 'access_token'
          project_id: ${{ inputs.project_id }}
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          # Only the access token is used (docker login below). The credentials file would be written
          # into the workspace, and Dockerfiles that `COPY . .` then bake it into the image.
          create_credentials_file: false

      # -
      #   name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      #   with:
      #     platforms: ${{ inputs.setup-platforms }}
      
          # Set up buildx     
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # This example uses the docker login action
      - name: Auth GCR 
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ inputs.docker-registry }}
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'  

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ inputs.build-platforms }}
          push: true
          tags: ${{ inputs.docker-image }}:${{ steps.tag.outputs.tag }}
          build-args: |
            ENVFILE=env/.env.${{ inputs.environment }}
            ENV=${{ inputs.environment }}
            CI_SHA=${{ inputs.docker-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            gh_token=${{ secrets.GH_PAT }}
