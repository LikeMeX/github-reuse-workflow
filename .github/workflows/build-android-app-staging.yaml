name: build-android-app-staging
on:
  workflow_call:
    inputs:
      LASTEST_VERSION_BUILD:
        description: "Lastest version build"
        required: true
        type: string
      LASTEST_VERSION_NAME:
        description: "Lastest version name"
        required: true
        type: string
      FIREBASE_GROUPS:
        description: "Firebase App Distribution tester groups, comma separated. Empty keeps the Fastfile default."
        required: false
        type: string
        default: ""
      RELEASE_NOTES:
        description: "Firebase App Distribution release notes. Empty keeps the Fastfile default."
        required: false
        type: string
        default: ""
    secrets:
      FIREBASE_DISTRIBUTION_ANDROID_APP_ID:
        description: "Firebase Distribution iOS App ID"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up git and fetch all history for all branches and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Aggressive early cleanup before any cache restore
        run: |
          echo "==== BEFORE ===="
          df -h

          echo "==== Remove GitHub runner bloat (safe for Android) ===="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo rm -rf /opt/hostedtoolcache

          #Android Emulator images only (SDK tools + platform-tools are kept)
          sudo rm -rf /usr/local/lib/android/sdk/system-images

          echo "==== Remove project & build caches ===="
          sudo rm -rf \
            ~/.gradle/caches \
            ~/.gradle/wrapper \
            ~/.pub-cache \
            ~/.android \
            ./android/.gradle \
            ./build \
            ./android/app/build \
            ./android/build

          echo "==== APT cache ===="
          sudo apt-get clean

          echo "==== AFTER ===="
          df -h
      - name: Set up JDK 18
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "18"
          distribution: "corretto"
          cache: gradle
      - name: Download a required file artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: key-dist
          path: ./key-dist
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3.5"
      - name: move google services file
        run: |
          mv ./key-dist/google-services.json ./android/app/google-services.json
      - name: move required files
        run: |
          mv ./key-dist/env ./lib/.env
          mv ./key-dist/key.properties ./android/key.properties
      - name: Bundle install for iOS Gemfile
        timeout-minutes: 5
        run: |
          gem update --system
          cd ./android && bundle install
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.4"
          architecture: x64
          cache: true
      - run: flutter pub get
      - run: flutter packages pub run build_runner build --delete-conflicting-outputs
      - name: Build and Deploy to TestFlight
        env:
          FIREBASE_DISTRIBUTION_ANDROID_APP_ID: ${{ secrets.FIREBASE_DISTRIBUTION_ANDROID_APP_ID }}
          LASTEST_VERSION_BUILD: ${{ inputs.LASTEST_VERSION_BUILD }}
          LASTEST_VERSION_NAME: ${{inputs.LASTEST_VERSION_NAME }}
          FIREBASE_GROUPS: ${{ inputs.FIREBASE_GROUPS }}
          RELEASE_NOTES: ${{ inputs.RELEASE_NOTES }}
        run: |
          cd ./android
          bundle exec fastlane staging
      - name: Free Disk Space (Cleanup)
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_android: true
          remove_folders: "./build ./android/app/build /home/runner/.pub-cache /opt/hostedtoolcache"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
      - name: Check free space after cleanup
        run: df -h
