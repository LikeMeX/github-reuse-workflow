name: Deploy to cluster

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      docker-image:
        required: true
        type: string
      docker-tag:
        required: true
        type: string
      env-suffix:
        # Append "-<environment>" to the image tag (skipped for production and when the tag already ends with it).
        # dev/staging/enterprise-v2 push to one registry with the commit SHA as tag; without the suffix, two envs building
        # the same commit overwrite each other's image, and NEXT_PUBLIC_* baked at build time point at the wrong env.
        # Set false when docker-tag names an image built elsewhere or consumed outside this workflow.
        type: boolean
        default: true
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string
      GKE_CLUSTER:
        required: true
        type: string
      GKE_ZONE:
        required: true
        type: string
      RELEASE_NAME:
        required: true
        type: string
      map_env_to_config:
        type: boolean
        default: true
    secrets:
      GH_PAT:
        required: true

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      # fs-app-chart is checked out by hand instead of `submodules: true`: the October 2026
      # history rewrite changed every commit SHA, so many repos still pin chart commits that
      # no longer exist. Use the pinned commit when it exists, otherwise fs-app-chart main.
      - name: Checkout fs-app-chart
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          pin=$(git ls-tree HEAD fs-app-chart | awk '{print $3}')
          rm -rf fs-app-chart
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/LikeMeX/fs-app-chart.git" fs-app-chart
          if [ -n "$pin" ] && git -C fs-app-chart cat-file -e "${pin}^{commit}" 2>/dev/null; then
            git -C fs-app-chart checkout --quiet "$pin"
          else
            echo "::warning::fs-app-chart pin ${pin:-<none>} not found; deploying with fs-app-chart main ($(git -C fs-app-chart rev-parse --short HEAD))"
          fi

      - name: Resolve image tag
        id: tag
        env:
          TAG: ${{ inputs.docker-tag }}
          ENV_NAME: ${{ inputs.environment }}
          SUFFIX: ${{ inputs.env-suffix }}
        run: |
          if [ "$SUFFIX" = true ] && [ "$ENV_NAME" != production ] && [ "${TAG%-$ENV_NAME}" = "$TAG" ]; then
            TAG="$TAG-$ENV_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Copy values file
        run: |-
          sed "s=<DOCKER_TAG>=${{ steps.tag.outputs.tag }}=g" < ./deploy/values-${{ inputs.environment }}.yaml > ./deploy/values.yaml

      - name: Auth GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Auth GKE Cluster
        id: get-credentials
        uses: "google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395" # v3
        with:
          cluster_name: ${{ inputs.GKE_CLUSTER }}
          location: ${{ inputs.GKE_ZONE }}
      - name: Apply ConfigMap
        if: ${{ inputs.map_env_to_config }}
        run: |
          if [ -f "env/.env.${{ inputs.environment }}" ]; then
            kubectl create configmap ${{ inputs.RELEASE_NAME }}-my-app --from-env-file=env/.env.${{ inputs.environment }} --namespace ${{ inputs.environment }} --dry-run=client -o yaml | kubectl apply -f -
          fi
      - name: Decrypt secrets with SOPS
        run: |
          if [ -f "secrets/.env.enc.${{ inputs.environment }}" ]; then
            curl -fsSL "https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64" -o /tmp/sops
            chmod +x /tmp/sops
            sudo mv /tmp/sops /usr/local/bin/sops
            sops -d "secrets/.env.enc.${{ inputs.environment }}" > "secrets/.env.dec.${{ inputs.environment }}"
          fi
      - name: Apply Secret
        run: |
          if [ -f "secrets/.env.dec.${{ inputs.environment }}" ]; then
            kubectl create secret generic ${{ inputs.RELEASE_NAME }}-secrets --from-env-file=secrets/.env.dec.${{ inputs.environment }} --namespace ${{ inputs.environment }} --dry-run=client -o yaml | kubectl apply -f -
          fi
      - name: Deploy
        run: |-
          helm upgrade --install --atomic --timeout 600s ${{ inputs.RELEASE_NAME }} -f deploy/values.yaml fs-app-chart/ --namespace ${{ inputs.environment }} --create-namespace
